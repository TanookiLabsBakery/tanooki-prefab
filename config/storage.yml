test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

digitalocean:
  service: S3
  access_key_id: <%= Rails.application.credentials.dig(:digitalocean, :spaces_access_key_id) %>
  secret_access_key: <%= Rails.application.credentials.dig(:digitalocean, :spaces_secret_access_key) %>
  region: <%= Rails.application.credentials.dig(:digitalocean, :spaces_region) || "nyc3" %>
  bucket: <%= Rails.application.credentials.dig(:digitalocean, :spaces_bucket) %>
  endpoint: https://<%= Rails.application.credentials.dig(:digitalocean, :spaces_region) || "nyc3" %>.digitaloceanspaces.com
  force_path_style: false
